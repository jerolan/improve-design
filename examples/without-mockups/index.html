<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4ee"><title>Pausa · Ejemplo de improve-design</title><style>
:root{--ink:#352d45;--muted:#665d78;--accent:#634687;--soft:#eee6f7;--canvas:#f7f4ee;--paper:#fffefa;--line:#d6d2c9;--warning:#8b401d}*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}::selection{background:var(--soft)}button{border:0;background:transparent}h1,h2,h3,p{margin:0}h1{font-size:34px;line-height:1.15;letter-spacing:-.025em;font-family:inherit}h2{font-size:24px;line-height:1.25}h3{font-size:18px}small{font-size:13px}.muted{color:var(--muted)}.intro,.feedback{max-width:650px;padding:40px 24px 70px;margin:auto;display:grid;gap:24px}.review-header{display:flex;justify-content:space-between;gap:20px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:12px}.review-header strong{color:var(--ink)}.intro>p{font-size:18px;color:var(--muted)}.expect{background:var(--soft);border-radius:18px;padding:20px;display:grid;gap:8px}.steps{margin:0;padding-left:23px;display:grid;gap:14px}.primary,.secondary{display:block;min-height:50px;padding:13px 20px;border-radius:14px;font-weight:700;width:100%;text-align:center}.primary{background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:var(--paper)}.actions{display:grid;gap:12px;margin-top:auto}.text-button{color:var(--accent);padding:12px 0;min-height:44px;text-align:left;font-weight:700}.app{width:100%;max-width:470px;min-height:100dvh;margin:auto;padding:20px 24px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:28px}.top{display:flex;align-items:center;gap:12px;min-height:44px}.top .brand{font-family:inherit;font-size:23px;font-weight:700}.grow{flex:1}.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}.icon svg{width:22px;height:22px}.app-heading{display:grid;gap:10px}.app-heading p{font-size:14px;color:var(--muted)}.content{display:grid;gap:24px}.cover-wrap{display:flex;align-items:center;justify-content:center;min-height:230px;background:var(--soft);border-radius:22px;padding:28px}.book-cover{width:148px;height:204px;background:#634687;border-radius:3px 10px 10px 3px;color:#fff4d7;padding:24px 16px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:5px 8px 12px #263a4320;border-left:5px solid #193640}.book-cover strong{font:25px/1.14 Georgia,serif;letter-spacing:-.02em}.book-cover small{font-size:10px;letter-spacing:.07em;text-transform:uppercase}.book-info{display:grid;gap:10px}.book-info h2{font-family:Georgia,serif;font-size:28px}.availability{display:inline-flex;gap:8px;align-items:center;font-weight:700;color:var(--accent);font-size:14px}.availability:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}.description{color:var(--muted);line-height:1.65}.meta{border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;gap:20px;font-size:13px;color:var(--muted)}.field{display:grid;gap:10px;font-weight:700}.field input,.field select,.feedback textarea{width:100%;min-height:52px;border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:12px;font-size:16px}.field small{font-weight:400;color:var(--muted)}.option-list{display:grid;gap:14px}.option{display:flex;align-items:center;gap:18px;min-height:96px;border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:18px;text-align:left}.option>span:first-child{background:var(--soft);color:var(--accent);width:48px;height:48px;display:grid;place-items:center;border-radius:16px;flex:none}.option>span:nth-child(2){display:grid;gap:5px;flex:1}.option[aria-pressed=true]{border:2px solid var(--accent);padding:17px;background:var(--soft)}.summary{margin:0;padding:20px;border-radius:18px;background:var(--paper);display:grid;gap:18px}.summary>div{display:flex;gap:20px;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:14px}.summary>div:last-child{padding-bottom:0;border-bottom:0}.summary dt{color:var(--muted);font-size:14px}.summary dd{margin:0;font-weight:700;text-align:right;max-width:65%}.success{padding:22px 0 12px;display:grid;justify-items:start;gap:16px}.success>span{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent)}.success svg{width:30px;height:30px}.success h1{font-size:36px}.error{background:#f7e5d7;color:var(--warning);padding:14px 16px;border-radius:14px}.feedback textarea{min-height:150px;resize:vertical;font-weight:400}.feedback label{display:grid;gap:12px;font-weight:700}.status{background:var(--soft);padding:14px;border-radius:14px;color:var(--ink)}.saved{font-size:13px;color:var(--muted)}.hidden{display:none!important}.skip{position:absolute;top:-80px;left:16px;padding:12px;background:var(--paper);color:var(--accent)}.skip:focus{top:10px}.review-note{font-size:13px;color:var(--muted)}@media(min-width:700px){.app{padding-top:28px}.intro,.feedback{padding-top:64px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><a class="skip" href="#main">Ir al contenido</a><main id="main"></main><script>
const CONFIG={"mode":"without-mockups","brand":"Pausa","title":"Programar una sesión","context":"Reserva un momento para concentrarte en una actividad.","expectation":"Al terminar verás una sesión programada con la actividad, la duración y la fecha que elegiste.","steps":["Elige tu actividad.","Ajusta la duración y la fecha.","Revisa y confirma la sesión.","Comprueba el resultado y deja tu opinión."],"ink":"#352d45","muted":"#665d78","accent":"#634687","soft":"#eee6f7","canvas":"#f7f4ee","cover":"#634687","serif":false};
const withMockup=false;
const root=document.getElementById('main');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>';
const closeIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>';
const checkIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>';
const key='improve-design-example:'+CONFIG.mode+':v1';
let phase='intro',step=0,error='',receipt=null,storage=true,comment='',reviewed=false,previousComplete=false,previousResult=null;
try{const prior=JSON.parse(localStorage.getItem(key)||'null');if(prior){comment=prior.comment||'';reviewed=prior.reviewed===true;previousComplete=prior.completed===true;previousResult=prior.result||null}localStorage.setItem(key,JSON.stringify({version:1,mode:CONFIG.mode,comment,reviewed,completed:previousComplete,result:previousResult}))}catch{storage=false}
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const initial=()=>({pickup:'Mañana, de 16:00 a 19:00',activity:'Leer',duration:'25',date:today()});
let draft=initial();
function persist(){try{localStorage.setItem(key,JSON.stringify(exportData()));storage=true}catch{storage=false}const el=document.getElementById('saved');if(el)el.textContent=storage?'Comentarios guardados en este navegador.':'No se pudo guardar en este navegador. Descarga tus comentarios antes de cerrar.'}
function exportData(){return {version:1,mode:CONFIG.mode,scenario:CONFIG.title,completed:previousComplete||receipt!==null,reviewed,comment,result:receipt||previousResult}}
function button(label,action,secondary=false){return '<button class="'+(secondary?'secondary':'primary')+'" data-action="'+action+'">'+label+'</button>'}
function summary(data){return '<dl class="summary">'+Object.entries(data).map(([k,v])=>'<div><dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd></div>').join('')+'</dl>'}
function selections(){return withMockup?{'Libro':'Un jardín en casa','Recogida':draft.pickup,'Lugar':'Biblioteca del barrio'}:{'Actividad':draft.activity,'Duración':draft.duration+' minutos','Fecha':new Date(draft.date+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})}}
function intro(){return '<section class="intro"><header class="review-header"><strong>improve-design</strong><span>'+ (withMockup?'Con mockups':'Sin mockups')+'</span></header><h1>'+CONFIG.title+'</h1><p>'+CONFIG.context+'</p><div class="expect"><strong>Qué esperamos ver</strong><span>'+CONFIG.expectation+'</span></div><h2>Tu recorrido</h2><ol class="steps">'+CONFIG.steps.map(t=>'<li>'+t+'</li>').join('')+'</ol>'+button('Iniciar recorrido','start')+'<p class="review-note">Ejemplo ficticio. Las operaciones se simulan en esta pestaña. Puedes salir en cualquier momento y dejar feedback parcial. Los comentarios se guardan en este navegador cuando es posible y se pueden descargar; no se envían al agente.</p></section>'}
function body(){if(step===3)return '<div class="success"><span>'+checkIcon+'</span><h1>'+(withMockup?'Reserva confirmada':'Sesión programada')+'</h1><p class="muted">'+(withMockup?'Te esperamos en la biblioteca.':'Tu tiempo ya tiene un lugar.')+'</p></div>'+summary(receipt)+'<div class="actions">'+button('Dar feedback','feedback')+button('Repetir recorrido','restart',true)+'</div>';
if(withMockup){if(step===0)return '<div class="cover-wrap"><div class="book-cover"><strong>Un jardín<br>en casa</strong><small>Lucía Prado</small></div></div><div class="book-info"><span class="availability">Disponible para reservar</span><h2>Un jardín en casa</h2><p class="muted">Lucía Prado</p><p class="description">Una guía para cultivar un rincón verde, incluso cuando el espacio es pequeño.</p></div><div class="meta"><span>Jardinería · 184 páginas</span><span>Préstamo de 14 días</span></div><div class="actions">'+button('Reservar este libro','next')+'</div>';
if(step===1)return '<p class="description">Tu libro estará preparado para la franja que elijas.</p><label class="field">Día de recogida<select data-field="pickup" aria-label="Día de recogida">'+['Mañana, de 16:00 a 19:00','Pasado mañana, de 10:00 a 13:00','El sábado, de 10:00 a 13:00'].map(v=>'<option '+(v===draft.pickup?'selected':'')+'>'+v+'</option>').join('')+'</select><small>Biblioteca del barrio · Mostrador principal</small></label><div class="actions">'+button('Revisar reserva','next')+button('Volver al libro','back',true)+'</div>';
return summary(selections())+'<p class="description">Conservaremos tu reserva hasta el final de la franja elegida.</p><div class="actions">'+button('Confirmar reserva','confirm')+button('Cambiar recogida','back',true)+'</div>'}
if(step===0)return '<p class="description">Elige aquello a lo que quieres dedicar este momento.</p><div class="option-list">'+[['Leer','Un capítulo sin interrupciones'],['Escribir','Avanza en esa idea pendiente'],['Estudiar','Una sesión con un solo objetivo']].map(([name,desc])=>'<button class="option" data-activity="'+name+'" aria-pressed="'+(draft.activity===name)+'"><span>'+name.slice(0,1)+'</span><span><strong>'+name+'</strong><small class="muted">'+desc+'</small></span></button>').join('')+'</div><div class="actions">'+button('Elegir horario','next')+'</div>';
if(step===1)return '<p class="description">'+esc(draft.activity)+' · Ajusta una sesión que te resulte posible.</p><label class="field">Duración en minutos<input type="number" min="10" max="180" step="5" inputmode="numeric" aria-label="Duración en minutos" data-field="duration" value="'+esc(draft.duration)+'" aria-describedby="durationHelp"><small id="durationHelp">Entre 10 y 180 minutos.</small></label><label class="field">Fecha<input type="date" min="'+today()+'" data-field="date" value="'+esc(draft.date)+'"></label><div class="actions">'+button('Revisar sesión','next')+button('Cambiar actividad','back',true)+'</div>';
return summary(selections())+'<p class="description">Podrás dedicar este momento a una sola actividad.</p><div class="actions">'+button('Programar sesión','confirm')+button('Cambiar horario','back',true)+'</div>'}
function app(){const heading=step===3?'':withMockup?['Tu próxima lectura','¿Cuándo lo recoges?','Revisa tu reserva'][step]:['Un momento para ti','Hazle espacio','Revisa tu sesión'][step];return '<section class="app" data-step="'+step+'"><header class="top"><button class="icon" data-action="back" aria-label="Volver" '+(step===0||step===3?'disabled':'')+'>'+arrow+'</button><strong class="brand">'+CONFIG.brand+'</strong><span class="grow"></span><button class="icon" data-action="feedback" aria-label="Salir y dar feedback">'+closeIcon+'</button></header>'+(heading?'<div class="app-heading"><h1>'+heading+'</h1><p>'+(withMockup?'Reserva':'Sesión')+' · '+(step+1)+' de 3</p></div>':'')+(error?'<p class="error" role="alert">'+esc(error)+'</p>':'')+'<div class="content">'+body()+'</div></section>'}
function feedback(){return '<section class="feedback"><header class="review-header"><strong>improve-design</strong><span>Feedback</span></header><h1>¿Era lo que esperabas?</h1><p class="status">'+(receipt?'Llegaste al final del recorrido.':'Revisión parcial. Aún puedes continuar el recorrido.')+'</p><label>Tu comentario<textarea id="comment" placeholder="Qué te resultó claro y qué cambiarías…">'+esc(comment)+'</textarea></label><p class="saved" id="saved">'+(storage?'Comentarios guardados en este navegador.':'No se pudo guardar en este navegador. Descarga tus comentarios antes de cerrar.')+'</p>'+button(reviewed?'Revisado':'Marcar como revisado','reviewed')+button('Descargar comentarios','download',true)+button('Volver al prototipo','resume',true)+'<p class="review-note">Los comentarios no se sincronizan entre dispositivos ni se envían al agente. Comparte el archivo descargado para que otra persona pueda leerlos.</p></section>'}
function render(){root.innerHTML=phase==='intro'?intro():phase==='app'?app():feedback()}
function validate(){if(withMockup)return true;const duration=Number(draft.duration);if(!Number.isFinite(duration)||duration<10||duration>180){error='Elige una duración entre 10 y 180 minutos.';return false}if(!/^\d{4}-\d{2}-\d{2}$/.test(draft.date)||!Number.isFinite(Date.parse(draft.date+'T12:00:00'))||draft.date<today()){error='Elige una fecha de hoy en adelante.';return false}return true}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.activity){draft.activity=b.dataset.activity;render();return}const a=b.dataset.action;error='';if(a==='start'){phase='app';step=0}else if(a==='next'){if(step===1&&!validate()){render();return}step=Math.min(2,step+1)}else if(a==='back')step=Math.max(0,step-1);else if(a==='confirm'){if(step!==2||!validate())return;receipt=selections();step=3;previousComplete=true;persist()}else if(a==='feedback'){phase='feedback';persist()}else if(a==='resume')phase='app';else if(a==='reviewed'){reviewed=true;persist()}else if(a==='restart'){draft=initial();receipt=null;step=0;phase='app'}else if(a==='download'){const url=URL.createObjectURL(new Blob([JSON.stringify(exportData(),null,2)],{type:'application/json;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='improve-design-'+CONFIG.mode+'-feedback.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}else return;render();window.scrollTo({top:0,behavior:'instant'})});
document.addEventListener('input',e=>{if(e.target.id==='comment'){comment=e.target.value;persist()}else if(e.target.dataset.field)draft[e.target.dataset.field]=e.target.value});
document.addEventListener('change',e=>{if(e.target.dataset.field)draft[e.target.dataset.field]=e.target.value});
render();
</script></body></html>
